appId: com.lucidbots.lucidapp.adhoc
---

- launchApp
# The ZenQuotes attribution only exists on the quote-of-the-day interstitial.
- assertNotVisible: ".*Quotes by ZenQuotes.*"
- extendedWaitUntil:
    visible: "Hi, Aj.*"
    timeout: 45000
# Home's add-habit control goes STRAIGHT to New Good Habit (d1b7c4b bypassed
# the old Add sheet; the mood chip opens only the mood card now).
- tapOn: "Add a habit"
- extendedWaitUntil:
    visible: ".*Create Custom Habit.*"
    timeout: 6000
- takeScreenshot: c02-new-good-habit
- tapOn: ".*Create Custom Habit.*"
- tapOn: ".*Try: Meditate x2.*"
- inputText: "Stretch x3"
- pressKey: Enter
- scrollUntilVisible:
    element: "Daily reminder"
    direction: DOWN
- tapOn: "Daily reminder"
- takeScreenshot: c02b-reminder-toggled
- tapOn: ".*09:00.*"
- eraseText: 8
- inputText: "21:30"
- pressKey: Enter
- takeScreenshot: c03-custom-habit-filled
- tapOn: ".*Add Habit"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: ".*Stretch added to your habits.*"
    timeout: 10000
- takeScreenshot: c03b-congrats
- tapOn: ".*Continue"
- extendedWaitUntil:
    visible: "Log Stretch"
    timeout: 10000
- scrollUntilVisible:
    element: "Log Stretch"
    direction: DOWN
    centerElement: true
- takeScreenshot: c04-home-with-stretch
- tapOn: "Log Stretch"
- tapOn: "Log Stretch"
- tapOn: "Log Stretch"
- assertVisible: "Stretch completed"
- takeScreenshot: c05-stretch-done
